modLoader="javafml" 
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Lxshhr/FleshZ/issues"

[[mods]] 
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    displayURL="https://github.com/Lxshhr/FleshZ/issues"
    logoFile="icon.png"
    authors="${mod_authors}"
    description='''${mod_description}'''

